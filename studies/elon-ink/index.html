<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elon Musk · Ink study · Codex Art</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="style.css">
  <script src="viewer.js" defer></script>
  <script src="draw.js" defer></script>
</head>
<body>
  <main>
    <header class="study-header">
      <h1>Elon Musk · Ink study</h1>
      <nav aria-label="Study navigation">
        <a href="../../index.html">All studies</a>
        <a href="draw.js">JavaScript source</a>
      </nav>
    </header>
    <figure>
      <div id="elon-ink-study">
        <div class="ink-toolbar viz-controls" role="group" aria-label="Portrait zoom">
          <button class="btn" type="button" data-zoom-out aria-label="Zoom out">−</button>
          <output class="ink-zoom tabular-nums" data-zoom-status aria-label="Zoom level" aria-live="polite">100%</output>
          <button class="btn" type="button" data-zoom-in aria-label="Zoom in">+</button>
          <button class="btn" type="button" data-zoom-fit>Fit portrait</button>
          <span class="ink-hint text-small text-muted">Zoom into a tiny face · Scroll or pinch · Drag to explore</span>
        </div>
        <canvas id="elon-ink-canvas" role="img" aria-describedby="ink-keyboard-help" aria-label="A recursive black-and-white portrait of Elon Musk. Zooming into the facial texture reveals miniature portraits, each containing smaller portraits of its own.">An ink portrait of Elon Musk made from smaller portraits, with swept-back hair, hooded eyes, and an open shirt collar.</canvas>
        <span id="ink-keyboard-help" class="sr-only">Focus a zoom button to use plus and minus to zoom, arrow keys to pan, and zero to fit the portrait. Double-click the artwork to zoom toward a detail.</span>
      </div>
      <figcaption>
        Code-drawn portrait by felirami with Codex, 2026. Visual reference:
        <a href="https://commons.wikimedia.org/wiki/File:Elon_Musk_Royal_Society_(crop2).jpg">Debbie Rowe / The Royal Society</a>, 2018.
        Adapted as a monochrome ink study. Artwork and portrait geometry:
        <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>.
      </figcaption>
    </figure>
  </main>
</body>
</html>
